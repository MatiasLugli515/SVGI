<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGVI - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>SGVI</h1>
            <p>Sistema de Gestión de Vehículos Incautados</p>
        </div>

        <form id="form-credenciales">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="operario@municipio.gob.ar">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>

        <form id="form-deposito" class="hidden">
            <p class="success-message">¡Autenticación exitosa!</p>
            <div class="input-group">
                <label for="deposito">Seleccione su lugar de trabajo:</label>
                <select id="deposito" required>
                    <option value="" disabled selected>Cargando depósitos...</option>
                    <option value="" disabled selected>Deposito 1</option>   //eliminar cuando se conecte con la API
                </select>
            </div>
            <button type="submit" class="btn-primary">Ingresar al Sistema</button>
        </form>
    </div>


    <script src="js/login.js"></script>
</html>
